{% extends "base.html" %}
{% block title %}Teacher Dashboard{% endblock %}
{% block content %}
<h1 class="mb-4">Teacher Dashboard</h1>
<div class="row">
    <div class="col-md-4">
        <div class="card text-white bg-primary mb-3">
            <div class="card-body">
                <h5 class="card-title">My Sections</h5>
                <p class="card-text">View your assigned sections.</p>
                <a href="{% url 'teacher-section-list' %}" class="btn btn-light">View</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success mb-3">
            <div class="card-body">
                <h5 class="card-title">Attendance</h5>
                <p class="card-text">Mark attendance for your sections.</p>
                <a href="#" class="btn btn-light">Soon</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-info mb-3">
            <div class="card-body">
                <h5 class="card-title">Assessments</h5>
                <p class="card-text">Create assessments and grade.</p>
                <a href="#" class="btn btn-light">Soon</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
