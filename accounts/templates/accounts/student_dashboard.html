{% extends "base.html" %}
{% block title %}Student Dashboard{% endblock %}
{% block content %}
<h1 class="mb-4">Student Dashboard</h1>
<div class="row">
    <div class="col-md-4">
        <div class="card text-white bg-primary mb-3">
            <div class="card-body">
                <h5 class="card-title">My Enrollments</h5>
                <p class="card-text">View your enrolled sections.</p>
                <a href="{% url 'student-enrollment-list' %}" class="btn btn-light">View</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success mb-3">
            <div class="card-body">
                <h5 class="card-title">Attendance</h5>
                <p class="card-text">Check your attendance summary.</p>
                <a href="{% url 'student-attendance-summary' %}" class="btn btn-light">View</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-info mb-3">
            <div class="card-body">
                <h5 class="card-title">Grades</h5>
                <p class="card-text">View your grade summary.</p>
                <a href="{% url 'student-grade-summary' %}" class="btn btn-light">View</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
